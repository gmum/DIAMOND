defaults:
  - config
  - model: sdxl_base
  - detector: default
  - loss: power
  - lambda_schedule: power
  - lora: disabled
  - _self_

task:
  name: generate_csv_sdxl

dtype: bfloat16

csv_path: dataset_sdxl/accepted_prompts.csv
negative_prompt: ""

generation:
  height: ${model.height}
  width: ${model.width}
  num_steps: ${model.num_steps}
  guidance_scale: 7.5

guidance:
  enabled: true
  grad_norm_eps: 1e-6
  normalize_grad: true

output:
  run_name: guided_sdxl
